# ipa-dev is build-only. Keep this workflow for reference, but never publish
# this development branch's TIPA-only artifacts as a four-package release.
# Re-enabling publication requires a separately reviewed release design.
name: Release (disabled on ipa-dev)

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ false }}
    runs-on: ubuntu-latest
    # Long enough to outlast a cold CI run: ten minutes of polling for it,
    # then a compile job that may take its full two hours.
    timeout-minutes: 180
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      # The newest run on the commit that a push or a dispatch started; a pull
      # request's run names its packages for the merge commit, not this one.
      - name: Wait for CI on the tagged commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=""
          for _ in $(seq 30); do
            run="$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --json databaseId,event \
              --jq '[.[] | select(.event != "pull_request")][0].databaseId // empty')"
            [ -n "$run" ] && break
            sleep 20
          done
          if [ -z "$run" ]; then
            echo "::error::CI has not run on $GITHUB_SHA: dispatch it on $GITHUB_REF_NAME, then re-run this"
            exit 1
          fi
          echo "CI run $run on $GITHUB_SHA"
          gh run watch "$run" --interval 30 > /dev/null
          conclusion="$(gh run view "$run" --json conclusion --jq .conclusion)"
          if [ "$conclusion" != success ]; then
            echo "::error::CI run $run ended $conclusion: nothing is published"
            exit 1
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: fila-${{ github.sha }}
          path: build/Packages/
          run-id: ${{ steps.ci.outputs.run }}
          github-token: ${{ github.token }}
      # CI's list proves the transfer. The release's own list is written for
      # exactly the files it carries, named for the tag, and a missing one
      # fails here.
      - name: Verify the packages and write the release checksums
        working-directory: build/Packages
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          version="${GITHUB_REF_NAME#v}"
          sha256sum \
            "wiki.qaq.fila_${version}_iphoneos-arm64.deb" \
            "wiki.qaq.fila_${version}_iphoneos-arm64e.deb" \
            "Fila_${version}.tipa" \
            "Fila_${version}.ipa" \
            "Fila_${version}_dSYMs.zip" \
            "Fila_${version}_sandboxed_dSYMs.zip" > SHA256SUMS
          cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/fila-release.md"
          if [ -f "Documentation/Releases/$version.md" ]; then
            cp "Documentation/Releases/$version.md" "$notes"
          else
            cat > "$notes" <<NOTES
          Fila $version, for roothide and for rootless (/var/jb) bootstraps, for
          TrollStore, and as an ordinary IPA to sideload.

          SHA-256 sums are in \`SHA256SUMS\`.
          NOTES
          fi
          files=("build/Packages/wiki.qaq.fila_${version}_iphoneos-arm64.deb"
                 "build/Packages/wiki.qaq.fila_${version}_iphoneos-arm64e.deb"
                 "build/Packages/Fila_${version}.tipa"
                 "build/Packages/Fila_${version}.ipa"
                 "build/Packages/Fila_${version}_dSYMs.zip"
                 "build/Packages/Fila_${version}_sandboxed_dSYMs.zip"
                 "build/Packages/SHA256SUMS")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber "${files[@]}"
            gh release edit "$GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "Fila $version" --notes-file "$notes" "${files[@]}"
          fi
