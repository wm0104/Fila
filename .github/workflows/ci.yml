# ipa-dev builds one TrollStore app archive. No ordinary IPA, DEB or release.
name: Fila TIPA CI

on:
  push:
    branches: [ipa-dev]
  pull_request:
    branches: [ipa-dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fila-tipa-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

# Keep Xcode 27.1 / iOS 27.1 SDK and the existing deployment floor.
# This counter belongs to ci.yml in this repository. The offset clears shipped
# build numbers; the marketing version is never automatically bumped here.
env:
  BUILD_NUMBER_FLOOR: "1000"

jobs:
  test:
    name: Host tests
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/ipa-dev') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ipa-dev') ||
      (github.event_name == 'pull_request' && github.base_ref == 'ipa-dev' && github.head_ref == 'ipa-dev')
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Test build and workflow checks
        run: python3 -m unittest discover -s Scripts/Tests -v
      - name: Run host tests
        run: make harness
      - name: Test app paged search
        run: python3 Scripts/test-app-search.py
      - name: Test app text matching and encoding
        run: python3 Scripts/test-app-viewer.py
      - name: Test app Debian package information
        run: python3 Scripts/test-app-deb.py
      - name: Test app job connection lifetimes
        run: python3 Scripts/test-app-operations.py

  compile:
    name: Compile and package one TIPA
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/ipa-dev') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ipa-dev') ||
      (github.event_name == 'pull_request' && github.base_ref == 'ipa-dev' && github.head_ref == 'ipa-dev')
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - name: Configure build paths
        shell: bash
        run: |
          set -euo pipefail
          echo "DERIVED_DATA=$RUNNER_TEMP/fila-tipa-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      # make check validates Debian metadata too, but no DEB is packaged.
      - name: Install validation and signing tools
        run: brew install ldid dpkg
      - name: Pin the build number to this run
        shell: bash
        run: |
          set -euo pipefail
          make set-version VERSION="$(make --no-print-directory print-version)" \
            BUILD="$(( GITHUB_RUN_NUMBER + BUILD_NUMBER_FLOOR ))"
      - name: Compile and check localization
        run: make compile DERIVED_DATA="$DERIVED_DATA"
      - name: Package and verify only the TIPA
        run: make _package-tipa DERIVED_DATA="$DERIVED_DATA"
      # ldid preserves LC_UUID, so these symbols match the signed payload.
      - name: Archive dSYMs
        shell: bash
        run: |
          set -euo pipefail
          version="$(make --no-print-directory print-version)"
          cd "$DERIVED_DATA/Build/Products/Release-iphoneos"
          zip -qry "$GITHUB_WORKSPACE/build/Packages/Fila_${version}_dSYMs.zip" *.dSYM
      - name: Check the exact TIPA outputs
        shell: bash
        run: |
          set -euo pipefail
          version="$(make --no-print-directory print-version)"
          (cd build/Packages && shasum -a 256 "Fila_${version}.tipa" "Fila_${version}_dSYMs.zip" > SHA256SUMS)
          bash Scripts/check-tipa-ci-packages.sh build/Packages "$version"
      # Upload once. Audits reuse these bytes; accept the artifact only when the run succeeds.
      - uses: actions/upload-artifact@v4
        with:
          name: fila-tipa-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-packages
          path: build/Packages/
          if-no-files-found: error
          retention-days: 30

  # Repeat the packaged image audit where older simulator Swift libraries exist.
  floor-audit:
    name: Floor audit against an older simulator runtime
    needs: [compile]
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fila-tipa-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-packages
          path: build/Packages/
      - name: Require exactly one TIPA with its symbols and checksums
        run: bash Scripts/check-tipa-ci-packages.sh build/Packages "$(make --no-print-directory print-version)"
      - name: Verify downloaded checksums
        working-directory: build/Packages
        run: shasum -a 256 -c SHA256SUMS
      - name: Audit every image in the TIPA at the floor
        shell: bash
        run: |
          set -euo pipefail
          baseline="$(xcrun simctl runtime list -j | python3 -c '
          import json, os, sys
          for runtime in json.load(sys.stdin).values():
              root = os.path.join(runtime.get("runtimeBundlePath", ""), "Contents/Resources/RuntimeRoot")
              if runtime.get("platformIdentifier", "").endswith("iphonesimulator") \
                      and os.path.isfile(os.path.join(root, "usr/lib/swift/libswiftCore.dylib")):
                  print(runtime["version"])
          ')"
          if [[ -z "$baseline" ]]; then
            echo "::error::No iOS simulator runtime here keeps its Swift libraries as files; the audit would check only its own list."
            exit 1
          fi
          echo "Baseline runtimes: $(tr '\n' ' ' <<<"$baseline")"
          floor="$(awk -F= '$1 ~ /^[[:space:]]*IPHONEOS_DEPLOYMENT_TARGET[[:space:]]*$/ { gsub(/[[:space:]]/, "", $2); print $2; exit }' Configuration/Base.xcconfig)"
          version="$(make --no-print-directory print-version)"
          unpacked="${RUNNER_TEMP:?}/floor-audit-tipa"
          mkdir -p "${unpacked:?}"
          unzip -q "build/Packages/Fila_${version}.tipa" -d "$unpacked"
          bash Scripts/audit-ios-floor.sh "$floor" "$unpacked/Payload/Fila.app"

  # Recheck the same artifact after all tests and audits; do not upload another copy.
  packages:
    name: Verify the single TIPA
    needs: [test, compile, floor-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fila-tipa-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-packages
          path: build/Packages/
      - name: Require exactly one TIPA with its symbols and checksums
        run: bash Scripts/check-tipa-ci-packages.sh build/Packages "$(make --no-print-directory print-version)"
      - name: Verify checksums
        working-directory: build/Packages
        run: sha256sum --check SHA256SUMS
