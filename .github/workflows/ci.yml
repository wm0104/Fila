# deb-dev builds only the roothide arm64e Debian layout. No IPA/TIPA or publishing.
name: Fila DEB CI

"on":
  push:
    branches: [deb-dev]
  pull_request:
    branches: [deb-dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fila-deb-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Keep ci.yml: run_number belongs to this repository's workflow, not a branch
# or the display name. This floor passes previously shipped builds 451/502.
# Only this workflow's counter is covered; other workflows are not coordinated.
# Re-runs keep the build number, but have distinct artifact names. The source
# marketing version is retained, never automatically bumped.
env:
  BUILD_NUMBER_FLOOR: "1000"

jobs:
  test:
    name: Host tests
    if: (github.event_name == 'push' && github.ref == 'refs/heads/deb-dev') || (github.event_name == 'pull_request' && github.base_ref == 'deb-dev') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/deb-dev')
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Test localization and workflow build checks
        run: python3 -m unittest discover -s Scripts/Tests -v
      - name: Run host tests
        run: make harness
      - name: Test app paged search
        run: python3 Scripts/test-app-search.py
      - name: Test app text matching and encoding
        run: python3 Scripts/test-app-viewer.py
      - name: Test app Debian package information
        run: python3 Scripts/test-app-deb.py
      - name: Test app job connection lifetimes
        run: python3 Scripts/test-app-operations.py

  compile:
    name: Compile full composition and verify arm64e DEB
    if: (github.event_name == 'push' && github.ref == 'refs/heads/deb-dev') || (github.event_name == 'pull_request' && github.base_ref == 'deb-dev') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/deb-dev')
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - name: Configure build paths
        shell: bash
        run: |
          set -euo pipefail
          echo "DERIVED_DATA=${RUNNER_TEMP:?}/fila-deb-${GITHUB_RUN_ID:?}-${GITHUB_RUN_ATTEMPT:?}" >> "${GITHUB_ENV:?}"
      - uses: actions/checkout@v4
      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Install packaging tools
        run: brew install ldid dpkg
      - name: Pin the build number to this run
        shell: bash
        run: |
          set -euo pipefail
          make set-version VERSION="$(make --no-print-directory print-version)" \
            BUILD="$(( GITHUB_RUN_NUMBER + BUILD_NUMBER_FLOOR ))"
      # compile retains SDK, project, localization and extracted-string checks.
      - name: Compile and check localization
        run: make compile DERIVED_DATA="${DERIVED_DATA:?}"
      # _package-deb signs and invokes verify-deb.sh, including composition,
      # entitlements, metadata and the packager's own iOS floor audit.
      - name: Package and verify roothide DEB only
        run: make _package-deb FLAVOR=roothide DERIVED_DATA="${DERIVED_DATA:?}"
      # ldid leaves LC_UUID unchanged; these symbols match the roothide package.
      - name: Archive dSYMs
        shell: bash
        run: |
          set -euo pipefail
          : "${DERIVED_DATA:?}" "${GITHUB_WORKSPACE:?}"
          version="$(make --no-print-directory print-version)"
          cd "${DERIVED_DATA:?}/Build/Products/Release-iphoneos"
          zip -qry "${GITHUB_WORKSPACE:?}/build/Packages/Fila_${version}_dSYMs.zip" *.dSYM
      - name: Write exact checksums and reject unexpected artifacts
        id: packages
        shell: bash
        run: |
          set -euo pipefail
          version="$(make --no-print-directory print-version)"
          (
            cd build/Packages
            shasum -a 256 \
              "wiki.qaq.fila_${version}_iphoneos-arm64e.deb" \
              "Fila_${version}_dSYMs.zip" > SHA256SUMS
          )
          python3 Scripts/verify-deb-artifacts.py build/Packages
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: fila-deb-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-built
          path: |
            build/Packages/wiki.qaq.fila_${{ steps.packages.outputs.version }}_iphoneos-arm64e.deb
            build/Packages/Fila_${{ steps.packages.outputs.version }}_dSYMs.zip
            build/Packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  # xcode-27 has no older runtime with Swift dylibs as files. Repeat the audit
  # on macos-26 and fail if no usable baseline exists. No sandboxed job needed.
  floor-audit:
    name: Floor audit against an older simulator runtime
    if: (github.event_name == 'push' && github.ref == 'refs/heads/deb-dev') || (github.event_name == 'pull_request' && github.base_ref == 'deb-dev') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/deb-dev')
    needs: [compile]
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fila-deb-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-built
          path: build/Packages/
      - name: Verify exact DEB artifact set and checksums
        run: python3 Scripts/verify-deb-artifacts.py build/Packages
      - name: Install dpkg
        run: brew install dpkg
      - name: Audit every packaged image at the floor
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?}"
          baseline="$(xcrun simctl runtime list -j | python3 -c '
          import json, os, sys
          for runtime in json.load(sys.stdin).values():
              root = os.path.join(runtime.get("runtimeBundlePath", ""), "Contents/Resources/RuntimeRoot")
              if runtime.get("platformIdentifier", "").endswith("iphonesimulator") \
                      and os.path.isfile(os.path.join(root, "usr/lib/swift/libswiftCore.dylib")):
                  print(runtime["version"])
          ')"
          if [[ -z "$baseline" ]]; then
            echo "::error::No iOS simulator runtime here keeps its Swift libraries as files; the audit would check only its own list."
            exit 1
          fi
          echo "Baseline runtimes: $(tr '\n' ' ' <<<"$baseline")"
          floor="$(awk -F= '$1 ~ /^[[:space:]]*IPHONEOS_DEPLOYMENT_TARGET[[:space:]]*$/ { gsub(/[[:space:]]/, "", $2); print $2; exit }' Configuration/Base.xcconfig)"
          shopt -s nullglob
          debs=(build/Packages/*.deb)
          if (( ${#debs[@]} != 1 )); then
            echo "::error::Expected exactly one roothide arm64e DEB."
            exit 1
          fi
          for deb in "${debs[@]}"; do
            unpacked="${RUNNER_TEMP:?}/floor-audit/$(basename "$deb")"
            mkdir -p "$unpacked"
            dpkg-deb -x "$deb" "$unpacked"
            app="$(find "$unpacked" -maxdepth 5 -type d -name Fila.app -print -quit)"
            daemon="$(find "$unpacked" -maxdepth 6 -type f -path '*/usr/libexec/filad' -print -quit)"
            helper="$(find "$unpacked" -maxdepth 6 -type f -path '*/usr/libexec/fila-archive' -print -quit)"
            if [[ -z "$app" || -z "$daemon" || -z "$helper" ]]; then
              echo "::error::$(basename "$deb") is missing Fila.app, filad or fila-archive."
              exit 1
            fi
            bash Scripts/audit-ios-floor.sh "$floor" "$app" "$daemon" "$helper"
          done

  packages:
    name: Collect the run's verified arm64e DEB
    if: (github.event_name == 'push' && github.ref == 'refs/heads/deb-dev') || (github.event_name == 'pull_request' && github.base_ref == 'deb-dev') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/deb-dev')
    needs: [test, compile, floor-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fila-deb-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-built
          path: build/Packages/
      - name: Verify exact DEB artifact set and read its version
        id: packages
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 Scripts/verify-deb-artifacts.py build/Packages)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: fila-deb-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-verified
          path: |
            build/Packages/wiki.qaq.fila_${{ steps.packages.outputs.version }}_iphoneos-arm64e.deb
            build/Packages/Fila_${{ steps.packages.outputs.version }}_dSYMs.zip
            build/Packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
