# deb-dev: no site deployment or cross-branch refresh. Historical steps stay
# dormant until a separately reviewed publishing design enables them.
name: Pages (disabled on deb-dev)

"on":
  workflow_dispatch:

permissions:
  contents: read

# One live site: let a running deploy finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-release:
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Refresh Pages from main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref main

  deploy:
    if: ${{ false }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check out the shared depiction updater
        uses: actions/checkout@v4
        with:
          repository: owngoal-dev/owngoal-packages
          ref: ef579aeebc7fe0ca1ba1165a1749665237c3a258
          path: .depiction-tools
          sparse-checkout: scripts/update-depiction-changelogs.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Fetch GitHub release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .depiction-tools/scripts/update-depiction-changelogs.py --workspace "$(dirname "$GITHUB_WORKSPACE")" --repo Fila
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Documentation/Site
      - id: deployment
        uses: actions/deploy-pages@v4
